      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 0.4s ease, visibility 0.4s ease;
        animation: appSplashFadeOut 0.45s ease 1.0s forwards;
        pointer-events: none;
      }
      #app-splash.hidden {
        opacity: 0;
        visibility: hidden;
      }
      @keyframes appSplashFadeOut {
        to { opacity: 0; visibility: hidden; }
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      .splash-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 70px;
        height: 70px;
        border-radius: 16px;
        background: radial-gradient(120% 120% at 50% 0%, #4D95FF 0%, #2373F4 60%, #1A5FD0 100%);
        box-shadow: 0 16px 48px rgba(35, 115, 244, 0.22);
        color: #ffffff;
        font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .splash-logo span {
        transform: translateY(1px);
      }
      .splash-progress {
        width: 110px;
        height: 3px;
        border-radius: 999px;
        background: rgba(35, 115, 244, 0.12);
        overflow: hidden;
        position: relative;
      }
      .splash-progress::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(35, 115, 244, 0) 0%, #2373F4 50%, rgba(35, 115, 244, 0) 100%);
        animation: splashProgress 1.0s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes splashProgress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash { animation-duration: 0.2s; animation-delay: 0.4s; }
        .splash-progress::after { animation: none; }
      }
    </style>
